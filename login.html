<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | Login System</title>
    <!-- โหลดฟอนต์ Google Font (Prompt) เพื่อความสวยงาม -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* จัดการสไตล์พื้นฐาน */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* กล่องฟอร์ม */
        .login-card {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .login-header h1 {
            color: #333333;
            font-size: 24px;
            font-weight: 600;
        }

        .login-header p {
            color: #666666;
            font-size: 14px;
            margin-top: 4px;
        }

        /* กลุ่มของ Input */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #4a5568;
            font-size: 14px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.2s ease-in-out;
            outline: none;
        }

        .form-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.25);
        }

        /* ตัวเลือกเพิ่มเติม (จดจำฉัน / ลืมรหัสผ่าน) */
        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 13px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #4a5568;
            cursor: pointer;
        }

        .forgot-password {
            color: #667eea;
            text-decoration: none;
            transition: color 0.2s;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        /* ปุ่มเข้าสู่ระบบ */
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #667eea;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-submit:hover {
            background-color: #5a67d8;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        /* ลิงก์สมัครสมาชิก */
        .signup-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #718096;
        }

        .signup-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <main class="login-card">
        <div class="login-header">
            <h1>เข้าสู่ระบบ</h1>
            <p>ยินดีต้อนรับ กรุณากรอกข้อมูลเพื่อเข้าใช้งาน</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">ชื่อผู้ใช้ หรือ อีเมล</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    placeholder="กรอกชื่อผู้ใช้หรืออีเมล" 
                    required 
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label for="password">รหัสผ่าน</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="กรอกรหัสผ่าน" 
                    required 
                    autocomplete="current-password"
                >
            </div>

            <div class="form-actions">
                <label class="remember-me">
                    <input type="checkbox" name="remember">
                    <span>จดจำฉันไว้</span>
                </label>
                <a href="#" class="forgot-password">ลืมรหัสผ่าน?</a>
            </div>

            <button type="submit" class="btn-submit">เข้าสู่ระบบ</button>
        </form>

        <div class="signup-link">
            ยังไม่มีบัญชี? <a href="#">สมัครสมาชิก</a>
        </div>
    </main>

</body>
</html>
